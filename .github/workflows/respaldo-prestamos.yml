# Copia diaria de la base de préstamos.
#
# Por qué acá y no dentro de Supabase: si el problema es Supabase —el proyecto
# se pausa, hay un incidente, se borra la cuenta— un respaldo guardado adentro
# de Supabase no sirve de nada. Esta copia vive en GitHub, que es otro lado.
#
# Es otro proyecto de Supabase que el de alquileres, así que usa su propio
# secret. Corre veinte minutos después para no pisarse con el otro respaldo.
#
# Hace falta un secret del repositorio llamado SUPABASE_DB_URL_PRESTAMOS. Sacalo de
# Supabase → Connect → Session pooler (puerto 5432). La conexión directa no
# sirve: es solo IPv6 y las máquinas de GitHub no la alcanzan.

name: Respaldo de la base de préstamos

on:
  schedule:
    # Todos los días a las 06:20 UTC, que son las 3:20 de la mañana en Argentina.
    - cron: "20 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: respaldo-prestamos
  cancel-in-progress: false

jobs:
  respaldar:
    runs-on: ubuntu-latest
    steps:
      # No usamos actions/checkout: pedirle una rama que todavía no existe
      # falla, y deja el repositorio a medio armar. Armamos el repo a mano, que
      # además nos deja tratar igual el primer respaldo y todos los siguientes.
      - name: Preparar el repositorio
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"

          if git ls-remote --exit-code --heads origin respaldos >/dev/null 2>&1; then
            echo "La rama respaldos ya existe: traigo el último commit."
            git fetch -q --depth=1 origin respaldos
            git checkout -q -b respaldos FETCH_HEAD
          else
            echo "Primer respaldo: creo la rama desde cero."
            git checkout -q -b respaldos
          fi

          mkdir -p respaldos

      - name: Volcar la base
        env:
          SUPABASE_DB_URL_PRESTAMOS: ${{ secrets.SUPABASE_DB_URL_PRESTAMOS }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_DB_URL_PRESTAMOS}" ]; then
            echo "Falta el secret SUPABASE_DB_URL_PRESTAMOS. Cargalo en Settings → Secrets."
            exit 1
          fi

          FECHA=$(date -u +%Y-%m-%d)
          ARCHIVO="respaldos/prestamos-${FECHA}.sql.gz"

          # pg_dump corre en un contenedor con la misma versión mayor que el
          # servidor, para que no se queje por diferencia de versiones.
          #
          # `set -o pipefail` (arriba) es lo que hace que un pg_dump fallido
          # rompa el paso: sin eso gzip termina bien igual y el respaldo queda
          # vacío sin que nadie se entere, que es peor que no tener respaldo.
          docker run --rm postgres:17-alpine \
            pg_dump "${SUPABASE_DB_URL_PRESTAMOS}" \
              --schema=public \
              --no-owner \
              --no-privileges \
              --format=plain \
            | gzip -9 > "${ARCHIVO}"

          # Un volcado de un esquema vacío ronda el kilobyte; menos que eso
          # significa que salió cualquier cosa.
          BYTES=$(stat -c%s "${ARCHIVO}")
          if [ "${BYTES}" -lt 200 ]; then
            echo "El respaldo pesa ${BYTES} bytes: algo salió mal."
            gzip -dc "${ARCHIVO}" | head -20
            exit 1
          fi

          echo "Respaldo del ${FECHA}: $(du -h "${ARCHIVO}" | cut -f1)"

      - name: Guardar la copia
        run: |
          set -euo pipefail
          git config user.name "Respaldo automático"
          git config user.email "actions@github.com"
          git add respaldos/

          if git diff --staged --quiet; then
            echo "Sin cambios: la base está igual que ayer."
            exit 0
          fi

          git commit -q -m "Respaldo de la base — $(date -u +%Y-%m-%d)"
          git push -q origin respaldos
          echo "Subido a la rama respaldos."
