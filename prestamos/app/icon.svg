<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- La pestaña del navegador dibuja esto a 16 o 32 px: va el peso solo,
       que es lo único que se distingue a ese tamaño. -->
  <rect width="100" height="100" rx="18" fill="#1877f2" />
  <text x="50" y="50" font-family="Georgia, 'Times New Roman', serif"
        font-weight="bold" font-size="66" fill="#f7f9fc"
        text-anchor="middle" dominant-baseline="central">$</text>
</svg>
