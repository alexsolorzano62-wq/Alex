<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="#4338ca" />
  <!-- De abajo hacia arriba: cada moneda se pinta del color del fondo para
       tapar la de atrás y que se lea como una pila. -->
  <g fill="#4338ca" stroke="#ffffff" stroke-width="6">
    <ellipse cx="50" cy="70" rx="30" ry="10" />
    <ellipse cx="50" cy="52" rx="30" ry="10" />
    <ellipse cx="50" cy="34" rx="30" ry="10" />
  </g>
</svg>
